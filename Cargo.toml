[package]
name = "sticky-notes"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sticky-notes"
path = "src/main.rs"

[dependencies]
slint = "1.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
tray-icon = "0.19"
image = "0.25"
anyhow = "1"
log = "0.4"
env_logger = { version = "0.11", default-features = false }
icu_provider = { version = "2", features = ["logging"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[build-dependencies]
slint-build = "1.9"

[profile.release]
codegen-units = 1
lto = true
